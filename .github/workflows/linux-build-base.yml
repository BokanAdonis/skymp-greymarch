name: Linux build base
on:
  workflow_call:
    inputs:
      base_system:
        type: string
        description: Base system name (one of the dependency scripts)
        required: true
      skip_tests:
        type: boolean
        description: Only build, skip tests and other checks
        required: false
        default: false
      extra_build_args:
        type: string
        description: 'Shell-escaped args for `./build.sh --build`. Example: `--target=skymp5-server`'
        required: false
        default: ''
      ccache:
        type: boolean
        description: 'GREYMARCH: keep a compile cache (ccache) between runs, so a build after a small change only recompiles what changed'
        required: false
        default: false
      auto_merge_action_config:
        type: string
        description: Auto-merge action config
        required: false
        default: ''
    secrets:
      combined_server_token:
        description: Token to check out and gather PRs required for building the server and gaamemode
        required: false

env:
    BUILD_TYPE: RelWithDebInfo
    # GREYMARCH: ccache settings for the build container (both empty when the ccache input is off)
    CCACHE_DOCKER_ARGS: ${{ inputs.ccache && '-e CCACHE_DIR=/src/.ccache -e CCACHE_BASEDIR=/src -e CCACHE_NOHASHDIR=1 -e CCACHE_MAXSIZE=3G' || '' }}
    CCACHE_CMAKE_ARGS: ${{ inputs.ccache && '-DCMAKE_C_COMPILER_LAUNCHER=/src/.ccache-bin/ccache -DCMAKE_CXX_COMPILER_LAUNCHER=/src/.ccache-bin/ccache' || '' }}

jobs:
    linux-build-base:
        runs-on: ubuntu-latest
        steps:
          - name: Checkout
            uses: actions/checkout@v6
            with:
              repository: ${{ github.repository }} # GREYMARCH: build OUR fork, not upstream
              ref: ${{ github.sha }}
              token: ${{ secrets.combined_server_token || github.token }}
              submodules: recursive
              fetch-depth: 0
              persist-credentials: false

          - name: Gather PRs
            id: gather_prs
            if: ${{ inputs.auto_merge_action_config }}
            uses: skyrim-multiplayer/auto-merge-action@main
            with:
              path: ${{ github.workspace }}
              repositories: ${{ inputs.auto_merge_action_config }}
              token: ${{ secrets.combined_server_token }}

          - name: Output commit tuple
            if: ${{ inputs.auto_merge_action_config }}
            run: |
              echo 'Commit tuple: ${{ steps.gather_prs.outputs['commit-tuple'] }}' | tee -a $GITHUB_STEP_SUMMARY

          - name: Debug - print env
            run: env

          - name: Get/build image to use for building & testing
            run: |
              set -x  # print executed commands

              echo Some debug data
              id
              uname -a
              lsb_release -a

              # cat ${{github.workspace}}/misc/github_env_linux >> "$GITHUB_ENV"

              # get base image for this distro (or build configuration, in case with skymp-deps)
              base_image="`misc/deps_linux/${{ inputs.base_system }}.sh --get-image-uri`"

              docker run \
                --name prepare_deps_container \
                -v "${{github.workspace}}:/src" \
                -w "/src" \
                -e "CI=$CI" \
                -e "CREATE_UID=`id -u`" \
                "$base_image" \
                'misc/deps_linux/${{ inputs.base_system }}.sh' '--ensure-deps-noninteractive'

              docker commit prepare_deps_container localhost/buildimage
              docker rm prepare_deps_container

          - name: Debug - check build tools
            run:
              docker run --rm -v "${{ github.workspace }}:/src" -w /src -u skymp localhost/buildimage bash -c "$script"
            env:
              script: |
                print_info_unsafe() {
                  echo .
                  echo .
                  echo "=== Checking $1 ==="
                  out="`which $1`"
                  ret="$?"
                  if [ "$ret" != 0 -o -z "$out" ]; then
                    echo "Which exited with $ret $out"
                    return
                  fi
                  ls -lh "$out"
                  echo "version call:"
                  "$out" --version
                }

                print_info() {
                  print_info_unsafe "$@" || true
                }

                print_info clang++
                print_info clang++-15
                print_info cmake
                print_info ninja
                print_info node
                print_info yarn
                print_info git
                print_info zip
                print_info unzip
                print_info curl

                echo .
                echo .
                echo === misc ===
                echo "current dir is $PWD"
                echo /src:
                ls -lh /src

                echo .
                echo .
                echo === env ===
                ./build.sh --print-env

          # Download Skyrim SE data files
          - uses: suisei-cn/actions-download-file@v1
            if: ${{ !inputs.skip_tests }}
            name: Download Skyrim.esm
            with:
              url: "https://gitlab.com/pospelov/se-data/-/raw/main/Skyrim.esm"
              target: ${{github.workspace}}/skyrim_data_files/
          - uses: suisei-cn/actions-download-file@v1
            if: ${{ !inputs.skip_tests }}
            name: Download Update.esm
            with:
              url: "https://gitlab.com/pospelov/se-data/-/raw/main/Update.esm"
              target: ${{github.workspace}}/skyrim_data_files/
          - uses: suisei-cn/actions-download-file@v1
            if: ${{ !inputs.skip_tests }}
            name: Download Dawnguard.esm
            with:
              url: "https://gitlab.com/pospelov/se-data/-/raw/main/Dawnguard.esm"
              target: ${{github.workspace}}/skyrim_data_files/
          - uses: suisei-cn/actions-download-file@v1
            if: ${{ !inputs.skip_tests }}
            name: Download HearthFires.esm
            with:
              url: "https://gitlab.com/pospelov/se-data/-/raw/main/HearthFires.esm"
              target: ${{github.workspace}}/skyrim_data_files/
          - uses: suisei-cn/actions-download-file@v1
            if: ${{ !inputs.skip_tests }}
            name: Download Dragonborn.esm
            with:
              url: "https://gitlab.com/pospelov/se-data/-/raw/main/Dragonborn.esm"
              target: ${{github.workspace}}/skyrim_data_files/

          # GREYMARCH: compile cache. A static ccache (checksum pinned) goes in /src/.ccache-bin and its cache in /src/.ccache; the cache
          # of the last run on this branch (or the default branch) is restored here, and a new one is saved after the build.
          - name: Get ccache
            if: ${{ inputs.ccache }}
            run: |
              v=4.14.2
              name="ccache-$v-linux-x86_64-musl-static"
              curl -fsSL -o /tmp/ccache.tar.xz "https://github.com/ccache/ccache/releases/download/v$v/$name.tar.xz"
              echo "b20ff6415151226ac5a10dfd6839700c694bd67d1871c8fddb266d366ff25bfb  /tmp/ccache.tar.xz" | sha256sum -c -
              tar xJf /tmp/ccache.tar.xz -C /tmp
              mkdir -p .ccache-bin .ccache
              cp "/tmp/$name/ccache" .ccache-bin/ccache
              .ccache-bin/ccache --version | head -1

          - name: Restore ccache
            if: ${{ inputs.ccache }}
            uses: actions/cache/restore@v4
            with:
              path: .ccache
              key: ccache-${{ inputs.base_system }}-${{ env.BUILD_TYPE }}-${{ github.run_id }}
              restore-keys: |
                ccache-${{ inputs.base_system }}-${{ env.BUILD_TYPE }}-

          - name: Prepare
            run: |
              docker run --rm -v "${{ github.workspace }}:/src" -w /src -u root localhost/buildimage \
                chown -R skymp:skymp /src

          - name: CMake Configure
            id: cmake_configure
            run: |
              docker run --rm -v "${{ github.workspace }}:/src" -w /src -u skymp localhost/buildimage \
                ./build.sh --configure \
                -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} $CCACHE_CMAKE_ARGS \
                -DUNIT_DATA_DIR="/src/skyrim_data_files"

          - name: Upload vcpkg logs
            if: always()
            uses: actions/upload-artifact@v7
            with:
              name: ${{inputs.base_system}}_vcpkg_logs
              path: |
                ${{github.workspace}}/build/vcpkg-*.log
                ${{github.workspace}}/vcpkg/buildtrees/**/*.log

          # Workaround for https://github.com/actions/upload-artifact/issues/785 and 769
          - name: Rename compile_commands.json
            run: |
              cd '${{ github.workspace }}/build'
              ln -s compile_commands.json '${{ inputs.base_system }}_compile_commands.json'

          - name: Upload compile_commands.json
            uses: actions/upload-artifact@v7
            with:
                name: ${{ inputs.base_system }}_compile_commands.json
                path: ${{ github.workspace }}/build/${{ inputs.base_system }}_compile_commands.json
                archive: false

          - name: Build
            run: |
              if [ -n "$CCACHE_DOCKER_ARGS" ]; then
                docker run --rm -v "${{ github.workspace }}:/src" -w /src -u skymp $CCACHE_DOCKER_ARGS localhost/buildimage .ccache-bin/ccache --zero-stats
              fi
              docker run --rm -v "${{ github.workspace }}:/src" -w /src -u skymp $CCACHE_DOCKER_ARGS localhost/buildimage \
                ./build.sh --build ${{ inputs.extra_build_args }}

          - name: ccache stats
            if: ${{ always() && inputs.ccache }}
            run: |
              docker run --rm -v "${{ github.workspace }}:/src" -w /src -u skymp $CCACHE_DOCKER_ARGS localhost/buildimage \
                sh -c '.ccache-bin/ccache --cleanup && .ccache-bin/ccache --show-stats --verbose' | tee -a $GITHUB_STEP_SUMMARY

          - name: Save ccache
            if: ${{ always() && inputs.ccache }}
            uses: actions/cache/save@v4
            with:
              path: .ccache
              key: ccache-${{ inputs.base_system }}-${{ env.BUILD_TYPE }}-${{ github.run_id }}

          - name: Prepare dist.tar.gz
            run: |
              docker run --rm -v "${{ github.workspace }}:/src" -w /src/build -u skymp localhost/buildimage \
                tar czvf dist.tar.gz dist

          # Workaround for https://github.com/actions/upload-artifact/issues/785 and 769
          - name: Rename dist.tar.gz
            run: |
              cd '${{ github.workspace }}/build'
              ln -s dist.tar.gz '${{ inputs.base_system }}_dist.tar.gz'

          - name: Upload dist.tar.gz
            uses: actions/upload-artifact@v7
            with:
              name: ${{ inputs.base_system }}_dist.tar.gz
              path: ${{ github.workspace }}/build/${{ inputs.base_system }}_dist.tar.gz
              archive: false

          - name: Test
            if: ${{ !inputs.skip_tests }}
            run: |
              # GREYMARCH: a build of only some targets (--target=...) has only part of the dist; DistContentsTest skips then
              docker run --rm -v "${{ github.workspace }}:/src" -w /src/build -u skymp \
                -e "SKYMP_PARTIAL_BUILD=${{ contains(inputs.extra_build_args, '--target') && '1' || '' }}" \
                localhost/buildimage \
                ctest -C ${{env.BUILD_TYPE}} --verbose --output-on-failure
