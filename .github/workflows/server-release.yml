name: Server release

# Turns a finished "Greymarch server build" run into a GitHub release (so the launcher repo can fetch it with a read-only token and deploy it).
# Manual: give the run id of the build (the number at the end of its URL).
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Run id of a finished Greymarch server build"
        required: true

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Get the build
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          mkdir art
          ID="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts" --jq '.artifacts[] | select(.name=="ubuntu-vcpkg-deps_dist.tar.gz") | .id' | head -1)"
          test -n "$ID"
          echo "artifact id $ID"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ID/zip" > art/download.bin
          ls -l art/download.bin
          # the artifact is stored either as the tarball itself or as a zip that holds it: tell them apart by the first two bytes
          MAGIC="$(head -c2 art/download.bin | od -An -tx1 | tr -d ' \n')"
          echo "first bytes: $MAGIC"
          if [ "$MAGIC" = "1f8b" ]; then
            cp art/download.bin server-dist.tar.gz
          else
            unzip -o art/download.bin -d art/unzipped
            F="$(find art/unzipped -name '*.tar.gz' | head -1)"
            test -n "$F"
            cp "$F" server-dist.tar.gz
          fi
          ls -l server-dist.tar.gz      - name: Check what is inside
        run: |
          set -euo pipefail
          tar -tzf server-dist.tar.gz | head -40
          tar -tzf server-dist.tar.gz | grep -E '(^|/)dist/server/dist_back/skymp5-server\.js$'
          tar -tzf server-dist.tar.gz | grep -E '(^|/)dist/server/scam_native\.node$'
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          SHA="$(gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json headSha -q .headSha)"
          gh release create "server-$RUN_ID" server-dist.tar.gz --repo "$GITHUB_REPOSITORY" --target "$SHA" \
            --title "Server build $RUN_ID" --notes "Built from commit $SHA by Greymarch server build run $RUN_ID."